[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-risk-engine-20260917"
version = "0.1.0"
description = "An explainable knowledge-graph pipeline for entity links, relationship paths, and risk evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "R-behera" }]
dependencies = []

[project.scripts]
knowledge-graph-risk-engine-20260917 = "knowledge_graph_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
